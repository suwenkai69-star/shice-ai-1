<body>
<div class="toast" id="toast"></div>
<input id="fileInput" type="file" accept=".csv,.json" hidden>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modal"></div></div>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">S</div><div><div class="brand-title">食策AI <span class="version">V0.5.0-R1</span></div><div class="brand-sub">AI餐饮经营助手 · Data Foundation</div></div></div>
    <div class="nav primary-nav">
      <button class="navbtn" data-page="overview"><span class="ico">⌂</span>经营概览</button>
      <button class="navbtn" data-page="diagnosis"><span class="ico">▣</span>经营诊断</button>
      <button class="navbtn" data-page="products"><span class="ico">▤</span>商品分析</button>
      <button class="navbtn" data-page="advice"><span class="ico">◉</span>AI建议</button>

    </div>
    <button class="demo-start" onclick="startDemo()"><span>▶</span><div><b>3分钟演示</b><small>从空状态完整走一遍</small></div></button>
  </aside>
  <main class="main">
    <div id="demoBar" class="demo-bar"></div>
    <section class="page" id="overview"></section>
    <section class="page" id="diagnosis"></section>
    <section class="page" id="products"></section>
    <section class="page" id="advice"></section>
    <section class="page" id="marketing"></section>
    <section class="page" id="data"></section>
    <section class="page" id="settings"></section>
  </main>
</div>
<script>
const SERVER_MODE=['http:','https:'].includes(location.protocol);
let serverReady=false;
let serverMeta={session:null,uploads:[]};
async function apiJson(path,opts={}){const r=await fetch(path,{headers:{...(opts.body instanceof FormData?{}:{'Content-Type':'application/json'}),...(opts.headers||{})},...opts});if(!r.ok){let m='请求失败';try{const j=await r.json();m=j.detail||j.message||m}catch(e){}throw new Error(m)}return r.json()}

const DEFAULT_SETTINGS={storeName:'永民手作',storeType:'奶茶店',period:'2026年6月',foodTargetRate:24.33,personnelWarn:25,deliveryWarn:30,localOnly:true,confirmHighRisk:true};
const DEMO_BUSINESS={revenue:77194.43,cups:6593,ingredientCost:18403.16,personnelCost:21074.08,cashProfit:-7025.00,theoreticalFoodRate:24.33,deliveryReductionRate:37.95,source:'内置演示数据'};
const DEMO_PRODUCTS=[
 {name:'珍珠奶茶',qty:1200,paidPrice:12.00,unitCost:2.61},{name:'柠檬茶',qty:1050,paidPrice:10.00,unitCost:1.80},{name:'杨枝甘露',qty:850,paidPrice:14.00,unitCost:4.32},{name:'芋泥波波',qty:780,paidPrice:13.00,unitCost:3.78},{name:'纯茶',qty:730,paidPrice:8.00,unitCost:1.17},{name:'生椰拿铁',qty:690,paidPrice:14.00,unitCost:3.24},{name:'葡萄冰茶',qty:650,paidPrice:12.00,unitCost:3.06},{name:'奶盖茶',qty:643,paidPrice:10.82,unitCost:2.61}
];
const DEMO_PLATFORM=[
 {category:'技术服务/佣金',amount:12000},{category:'配送相关',amount:7000},{category:'商家承担优惠',amount:6200},{category:'推广费用',amount:2500},{category:'退款及其他',amount:1595.30}
];
const DEMO_WORKFORCE=[
 {hour:'10:00',orders:220,staffHours:90},{hour:'11:00',orders:380,staffHours:120},{hour:'12:00',orders:680,staffHours:150},{hour:'13:00',orders:720,staffHours:150},{hour:'14:00',orders:390,staffHours:120},{hour:'15:00',orders:280,staffHours:120},{hour:'16:00',orders:300,staffHours:120},{hour:'17:00',orders:420,staffHours:120},{hour:'18:00',orders:700,staffHours:150},{hour:'19:00',orders:850,staffHours:150},{hour:'20:00',orders:780,staffHours:150},{hour:'21:00',orders:590,staffHours:120},{hour:'22:00',orders:283,staffHours:90}
];
const EMPTY_STATE={business:null,validationBusiness:null,products:[],platform:[],workforce:[],marketingHistory:[],chatHistory:[],actions:{platform:'pending',workforce:'pending',food:'hold',product:'pending'},settings:{...DEFAULT_SETTINGS},selectedProduct:null,lastUpdated:{}};
let state=loadState();
let currentPage='overview';
let uploadTarget='business';
let demoMode=false,demoStep=0;
const DEMO_FLOW=[
 {page:'overview',title:'从空状态开始',text:'先让评审看到：没有数据时系统不会编结论。'},
 {page:'overview',title:'经营结果',text:'载入真实结构的示例数据：销售7.7万，但现金利润为负。'},
 {page:'diagnosis',title:'经营诊断',text:'AI区分事实、推断和缺失证据，给出下一步核查顺序。'},
 {page:'products',title:'商品结构',text:'用SKU销量和毛利找核心、优化与增长测试对象。'},
 {page:'advice',title:'行动建议',text:'把诊断转成S/A/B/C级动作，并记录执行状态。'},
 {page:'marketing',title:'营销执行',text:'选择一个SKU生成可落地的营销测试方案，完成闭环。'}
];

function loadState(){
  try{const raw=localStorage.getItem('shice_v04_state');if(raw){const s=JSON.parse(raw);return {...structuredClone(EMPTY_STATE),...s,settings:{...DEFAULT_SETTINGS,...s.settings},actions:{...EMPTY_STATE.actions,...s.actions},chatHistory:Array.isArray(s.chatHistory)?s.chatHistory:[]}}}catch(e){}
  return structuredClone(EMPTY_STATE);
}
function saveState(){try{localStorage.setItem('shice_v04_state',JSON.stringify(state))}catch(e){} if(serverReady){apiJson('/api/state',{method:'PUT',body:JSON.stringify({state})}).catch(e=>console.warn('server sync failed',e))} renderAll()}
async function refreshServerMeta(){if(!serverReady)return;try{const [sess,ups]=await Promise.all([apiJson('/api/session'),apiJson('/api/uploads')]);serverMeta={session:sess,uploads:ups.uploads||[]}}catch(e){}}
async function hydrateServer(){if(!SERVER_MODE)return;try{await apiJson('/api/health');const r=await apiJson('/api/state');serverReady=true;await refreshServerMeta();state={...structuredClone(EMPTY_STATE),...(r.state||{}),settings:{...DEFAULT_SETTINGS,...(r.state?.settings||{})},actions:{...EMPTY_STATE.actions,...(r.state?.actions||{})}};try{localStorage.setItem('shice_v04_state',JSON.stringify(state))}catch(e){}renderAll();showToast('已连接 V0.5.0-R1 服务端 · SQLite持久化')}catch(e){serverReady=false;console.warn('V0.4 backend unavailable, fallback local mode',e)}}
function fmtMoney(n){if(n===null||n===undefined||!Number.isFinite(Number(n)))return '—';const x=Number(n);return (x<0?'-¥':'¥')+Math.abs(x).toLocaleString('zh-CN',{maximumFractionDigits:0})}
function fmtMoney2(n){if(n===null||n===undefined||!Number.isFinite(Number(n)))return '—';const x=Number(n);return (x<0?'-¥':'¥')+Math.abs(x).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fmtPct(n,d=2){return Number.isFinite(Number(n))?Number(n).toFixed(d)+'%':'—'}
function pct(a,b){return b?Number(a)/Number(b)*100:0}
function nowText(ts){if(!ts)return '未导入';return new Date(ts).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('show'),2200)}
function go(page){if(!document.getElementById(page))return;currentPage=page;document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===page));document.querySelectorAll('.navbtn[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));try{if(['http:','https:'].includes(location.protocol))history.replaceState(null,'','?page='+page)}catch(e){}window.scrollTo(0,0)}
function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalBackdrop').classList.add('show')}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('show')}
document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});
function openUpload(target){uploadTarget=target;const f=document.getElementById('fileInput');f.value='';f.click()}
function sourceStatus(key){const has=key==='business'?!!state.business:(state[key]?.length>0);return has?`<span class="uploaded">✓ 已导入</span>`:`<span class="missing">— 未导入</span>`}
function dataCount(){return ['business','products','platform','workforce'].reduce((n,k)=>n+((k==='business'?!!state.business:state[k]?.length>0)?1:0),0)}
function getDerived(){
 const b=state.business;if(!b)return null;
 const foodRate=pct(b.ingredientCost,b.revenue),personnelRate=pct(b.personnelCost,b.revenue),profitRate=pct(b.cashProfit,b.revenue);
 const target=Number(b.theoreticalFoodRate??state.settings.foodTargetRate);const delivery=Number(b.deliveryReductionRate??0);
 return {foodRate,personnelRate,profitRate,target,delivery};
}
function getProductStats(){
 if(!state.products.length)return null;
 const rows=state.products.map(p=>{const revenue=p.qty*p.paidPrice,cost=p.qty*p.unitCost,margin=p.paidPrice?((p.paidPrice-p.unitCost)/p.paidPrice*100):0,contribution=revenue-cost;return {...p,revenue,cost,margin,contribution}});
 const sortedQ=[...rows].sort((a,b)=>a.qty-b.qty),sortedM=[...rows].sort((a,b)=>a.margin-b.margin);const median=a=>a.length%2?a[(a.length-1)/2]:(a[a.length/2-1]+a[a.length/2])/2;
 const qMedian=median(sortedQ.map(x=>x.qty)),mMedian=median(sortedM.map(x=>x.margin));const totalRevenue=rows.reduce((s,x)=>s+x.revenue,0),totalContribution=rows.reduce((s,x)=>s+x.contribution,0),weightedMargin=totalRevenue?totalContribution/totalRevenue*100:0;
 rows.forEach(r=>{const highQ=r.qty>=qMedian,highM=r.margin>=mMedian;r.quad=highQ&&highM?'core':highQ&&!highM?'optimize':!highQ&&highM?'grow':'review';r.advice=r.quad==='core'?'核心商品：保持稳定并优先曝光':r.quad==='optimize'?'高销量低毛利：优先检查定价、活动或成本':r.quad==='grow'?'低销量高毛利：适合测试增加曝光':'低销量低毛利：先验证保留价值';});
 return {rows,qMedian,mMedian,totalRevenue,weightedMargin,optimizeCount:rows.filter(r=>r.quad==='optimize'||r.quad==='review').length};
}
function getPlatformStats(){if(!state.platform.length)return null;const total=state.platform.reduce((s,x)=>s+Number(x.amount||0),0);const rows=state.platform.map(x=>({...x,share:total?Number(x.amount)/total*100:0})).sort((a,b)=>b.amount-a.amount);return {rows,total,top:rows[0]}}
function getWorkforceStats(){if(!state.workforce.length)return null;const rows=state.workforce.map(x=>({...x,eff:Number(x.staffHours)?Number(x.orders)/Number(x.staffHours):0})).sort((a,b)=>a.hour.localeCompare(b.hour));const sorted=[...rows].sort((a,b)=>a.eff-b.eff);return {rows,low:sorted.slice(0,3),high:[...rows].sort((a,b)=>b.eff-a.eff).slice(0,3),avg:rows.reduce((s,x)=>s+x.eff,0)/rows.length}}
function businessSummaryText(){
 const b=state.business,d=getDerived();if(!b)return '尚未导入经营数据。';
 let parts=[];if(d.foodRate<=d.target)parts.push(`食材实际耗用率 ${fmtPct(d.foodRate)} 未高于理论口径 ${fmtPct(d.target)}，目前不把食材成本列为首要异常项`);else parts.push(`食材实际耗用率 ${fmtPct(d.foodRate)} 高于理论口径 ${fmtPct(d.target)}，值得进一步核查损耗和SKU结构`);
 if(d.delivery>=state.settings.deliveryWarn)parts.push(`到家端收入减少比例 ${fmtPct(d.delivery)} 高于当前预警阈值 ${fmtPct(state.settings.deliveryWarn,0)}`);if(d.personnelRate>=state.settings.personnelWarn)parts.push(`人员成本率 ${fmtPct(d.personnelRate)} 高于当前关注阈值 ${fmtPct(state.settings.personnelWarn,0)}`);
 return parts.join('；')+'。';
}
function renderAll(){const sidebarStore=document.getElementById('sidebarStore');if(sidebarStore)sidebarStore.textContent=state.settings.storeName||'未命名门店';renderOverview();renderDiagnosis();renderProducts();renderAdvice();renderMarketing();renderData();renderSettings();renderDemoBar();go(currentPage)}
function topbar(title,subtitle,buttons=''){return `<div class="topbar"><div><h1 class="title">${title}</h1><div class="subtitle">${subtitle}</div></div><div class="controls">${buttons}</div></div>`}
function renderOverview(){
 const el=document.getElementById('overview'),b=state.business,d=getDerived();

function askAILocal(q,id){q=(q||'').trim();if(!q)return;const b=state.business,d=getDerived(),ps=getProductStats(),p=getPlatformStats(),w=getWorkforceStats();let a='';if(!b)a='目前还没有经营数据。先上传经营数据后，我才能基于事实回答。';else if(/为什么|亏/.test(q))a=`当前现金利润率为 ${fmtPct(d.profitRate)}。${businessSummaryText()} ${!p?'平台费用仍缺明细。':''} ${!w?'人员成本仍缺小时订单与排班数据。':''}`;else if(/先|最应该|优先/.test(q))a=!p?'优先补平台结算明细，因为当前只有37.95%的综合到家端收入减少比例，无法定位具体构成。':!w?'平台费用已拆解，下一步补小时订单与排班数据，判断人员成本结构。':!ps?'平台和排班已有数据，下一步补SKU销量与成本，判断商品结构。':'四类核心数据已齐。当前优先看平台可控费用项与低人效时段，再结合高销量低毛利SKU制定动作。';else if(/涨价|价格/.test(q))a=!ps?'现在不能判断是否涨价，因为缺少SKU售价、销量和单位成本。上传商品表后再判断。':(()=>{const x=ps.rows.filter(r=>r.quad==='optimize').sort((a,b)=>b.qty-a.qty)[0];return x?`如果要测试价格调整，优先从“${x.name}”这类高销量但相对低毛利商品做小范围验证。当前毛利率约 ${fmtPct(x.margin,1)}，不建议全店统一涨价。`:'当前商品结构里没有明显的“高销量低毛利”SKU，不建议仅因为整体亏损就全店涨价。'})();else if(/人工|排班|人效/.test(q))a=!w?'不建议直接裁员。先上传小时订单与累计人时，判断低峰冗余和高峰承载。':`最低人效时段集中在 ${w.low.map(x=>x.hour).join('、')}，平均约 ${w.low.map(x=>x.eff.toFixed(2)).join('/')} 单/人时。建议先做排班模拟，再用下一周期数据验证。`;else if(/商品|SKU|推广|主推/.test(q))a=!ps?'请先上传商品销量与成本。':(()=>{const x=ps.rows.filter(r=>r.quad==='grow').sort((a,b)=>b.margin-a.margin)[0]||ps.rows.sort((a,b)=>b.contribution-a.contribution)[0];return `可以优先测试“${x.name}”。它当前毛利率约 ${fmtPct(x.margin,1)}，属于${x.quad==='grow'?'低销量高毛利':'贡献利润较高'}类型。你可以在AI营销页生成一个小规模曝光测试方案。`})();else a=`我可以基于当前 ${dataCount()}/4 类数据回答经营、商品、平台费用、排班和营销问题。对于没有导入的数据，我不会给出确定结论。`;
 state.chatHistory=[...(state.chatHistory||[]),{q,a,ts:Date.now()}].slice(-20);saveState();setTimeout(()=>{const box=document.getElementById(id);if(box)box.scrollTop=box.scrollHeight;const inp=document.getElementById(id+'Input');if(inp)inp.value=''},0);
}
async function askAI(q,id){
 q=(q||'').trim();if(!q)return;

 return askAILocal(q,id);
}

function adviceCard(letter,cls,title,text,items,actionKey,buttonText,onClick){const st=state.actions[actionKey]||'pending';const status=st==='done'||st==='reviewed'?'<span class="pill demo">已处理</span>':st==='planned'?'<span class="pill info">已计划</span>':'<span class="pill neutral">待处理</span>';return `<div class="reco ${cls}"><div class="grade"><span class="badge">${letter}</span><div><b>级动作</b><small>${letter==='S'?'优先级最高':letter==='A'?'优先级较高':'验证型动作'}</small></div></div><div class="reco-main"><h4>${title} ${status}</h4><p>${text}</p></div><div class="reco-side"><h5>建议步骤</h5><ul>${items.map(x=>`<li>${x}</li>`).join('')}</ul><button class="btn ${letter==='S'?'red':letter==='A'?'orange':letter==='C'?'blue':'ghost-green'} small" onclick="${onClick}">${buttonText}</button></div></div>`}

function trackingSteps(){const started=Object.values(state.actions).some(x=>['planned','reviewed','done'].includes(x)),done=Object.values(state.actions).filter(x=>['reviewed','done'].includes(x)).length;return `<div class="step done"><span class="step-dot"></span>发现问题</div><div class="step done"><span class="step-dot"></span>给出建议</div><div class="step ${done>=2?'done':started?'current':''}"><span class="step-dot"></span>执行方案</div><div class="step ${state.validationBusiness?'done':done>=3?'current':''}"><span class="step-dot"></span>验证效果</div>`}

function generateMarketingLocal(){const ps=getProductStats(),name=document.getElementById('marketingProduct').value,goal=document.getElementById('marketingGoal').value,channel=document.getElementById('marketingChannel').value,p=ps.rows.find(x=>x.name===name)||ps.rows[0];const type=p.quad==='grow'?'低销量高毛利':p.quad==='optimize'?'高销量低毛利':p.quad==='core'?'核心商品':'待复核商品';const strategy=`商品：${p.name}\n当前分类：${type}\n当前毛利率：${fmtPct(p.margin,1)}\n目标：${goal}\n渠道：${channel}\n\n建议：先做7天小规模测试，不把“曝光增加”直接等同于“利润改善”。测试前记录销量、平均实付价和贡献利润；测试后用同口径复盘。${p.quad==='optimize'?'该商品销量已经较高，优先避免继续扩大低毛利促销。':'可以先增加曝光，但不建议在没有活动成本数据时直接做大额优惠。'}`;const copy=`【${p.name}｜本周小测试】\n不是全店大促，只想看看大家是不是真的喜欢这一杯。\n${channel==='小红书'?'如果你最近刚好想喝点不一样的，可以来试试，喝完告诉我们你会不会二刷。':'本周会给它更多一点曝光，价格与活动以门店实际页面为准。'}\n\n#${p.name} #奶茶 #门店新品测试`;

function renderDemoBar(){const bar=document.getElementById('demoBar');if(!bar)return;if(!demoMode){bar.className='demo-bar';bar.innerHTML='';return}const step=DEMO_FLOW[demoStep]||DEMO_FLOW[0];bar.className='demo-bar show';const finalLabel=demoStep>=DEMO_FLOW.length-1?(state.marketingHistory.length?'完成演示':'生成方案 →'):'下一步 →';bar.innerHTML=`<div class="demo-stage"><span class="demo-stage-badge">${demoStep+1}</span><div class="demo-stage-text"><b>${esc(step.title)}</b><small>${esc(step.text)}</small></div><div class="demo-progress">${DEMO_FLOW.map((_,i)=>`<i class="${i<demoStep?'done':i===demoStep?'active':''}"></i>`).join('')}</div></div><div class="demo-actions"><button class="btn small" onclick="endDemo()">退出演示</button><button class="btn primary small" onclick="demoNext()">${demoStep===0&&!state.business?'载入演示数据 →':finalLabel}</button></div>`}

async function loadSample(k){if(serverReady){try{const r=await apiJson('/api/sample/'+k,{method:'POST'});state=r.state;try{localStorage.setItem('shice_v04_state',JSON.stringify(state))}catch(e){}renderAll();showToast(k==='all'?'服务端已载入完整演示数据':'服务端已载入示例数据');return}catch(e){showToast('服务端示例载入失败，已用本地示例')}}if(k==='business'||k==='all'){state.business={...DEMO_BUSINESS};state.lastUpdated.business=Date.now()}if(k==='products'||k==='all'){state.products=structuredClone(DEMO_PRODUCTS);state.lastUpdated.products=Date.now()}if(k==='platform'||k==='all'){state.platform=structuredClone(DEMO_PLATFORM);state.lastUpdated.platform=Date.now()}if(k==='workforce'||k==='all'){state.workforce=structuredClone(DEMO_WORKFORCE);state.lastUpdated.workforce=Date.now()}saveState();showToast(k==='all'?'已载入完整演示数据':'已载入示例数据')}
function parseCSV(text){const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());if(!lines.length)return[];const parseLine=line=>{let arr=[],cur='',q=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){if(q&&line[i+1]==='"'){cur+='"';i++}else q=!q}else if(c===','&&!q){arr.push(cur.trim());cur=''}else cur+=c}arr.push(cur.trim());return arr};const headers=parseLine(lines[0]);return lines.slice(1).map(line=>{const vals=parseLine(line),o={};headers.forEach((h,i)=>o[h]=vals[i]??'');return o})}
function num(v){const n=Number(String(v??'').replace(/[¥￥,%\s]/g,'').replace(/,/g,''));return Number.isFinite(n)?n:null}
function pick(row,names){for(const n of names)if(row[n]!==undefined&&row[n]!=='')return row[n];return null}
function normalizeBusiness(rows){const r=rows[0]||{};const revenue=num(pick(r,['销售收入','营业额','revenue','sales'])),cups=num(pick(r,['销量','杯数','订单数','cups','orders'])),ingredientCost=num(pick(r,['食材成本','原料成本','ingredientCost','food_cost'])),personnelCost=num(pick(r,['人员成本','人工成本','personnelCost','labor_cost'])),cashProfit=num(pick(r,['现金利润','利润','cashProfit','profit']));if([revenue,cups,ingredientCost,personnelCost,cashProfit].some(x=>x===null))throw new Error('经营数据缺少必要字段：销售收入、销量、食材成本、人员成本、现金利润');return {revenue,cups,ingredientCost,personnelCost,cashProfit,theoreticalFoodRate:num(pick(r,['理论食材成本率','理论成本率','theoreticalFoodRate']))??state.settings.foodTargetRate,deliveryReductionRate:num(pick(r,['到家端收入减少比例','到家综合收入减少','deliveryReductionRate']))??0,source:'用户导入'} }
function normalizeProducts(rows){const out=rows.map(r=>({name:String(pick(r,['商品','商品名','产品','name'])||'').trim(),qty:num(pick(r,['销量','数量','qty','quantity'])),paidPrice:num(pick(r,['平均实付价','实付价','售价','price','paidPrice'])),unitCost:num(pick(r,['单位成本','单份成本','成本','unitCost','cost']))})).filter(x=>x.name&&[x.qty,x.paidPrice,x.unitCost].every(v=>v!==null));if(!out.length)throw new Error('商品CSV需要：商品、销量、平均实付价、单位成本');return out}
function normalizePlatform(rows){const out=rows.map(r=>({category:String(pick(r,['费用类别','类别','项目','category'])||'').trim(),amount:num(pick(r,['金额','费用','amount']))})).filter(x=>x.category&&x.amount!==null);if(!out.length)throw new Error('平台CSV需要：费用类别、金额');return out}
function normalizeWorkforce(rows){const out=rows.map(r=>({hour:String(pick(r,['小时','时段','hour'])||'').trim(),orders:num(pick(r,['订单数','订单','orders'])),staffHours:num(pick(r,['累计人时','人时','staffHours','labor_hours']))})).filter(x=>x.hour&&x.orders!==null&&x.staffHours!==null&&x.staffHours>0);if(!out.length)throw new Error('排班CSV需要：小时、订单数、累计人时');return out}
document.getElementById('fileInput').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{
 if(uploadTarget==='backup'){const text=await file.text();if(!file.name.toLowerCase().endsWith('.json'))throw new Error('备份文件必须是JSON');const bk=JSON.parse(text);if(serverReady&&bk.backup_format==='shice-ai-full-v1'){const r=await apiJson('/api/restore',{method:'POST',body:JSON.stringify(bk)});state=r.state;try{localStorage.setItem('shice_v04_state',JSON.stringify(state))}catch(e){}await refreshServerMeta();renderAll();showToast('完整备份已恢复');return}const legacy=bk.state&&bk.backup_format?bk.state:bk;state={...structuredClone(EMPTY_STATE),...legacy,settings:{...DEFAULT_SETTINGS,...(legacy.settings||{})},actions:{...EMPTY_STATE.actions,...(legacy.actions||{})}};saveState();showToast(serverReady?'已恢复旧版状态备份（不含V2账目）':'备份已恢复');return}
 if(serverReady){const fd=new FormData();fd.append('file',file);const r=await apiJson('/api/upload/'+uploadTarget,{method:'POST',body:fd});state=r.state;try{localStorage.setItem('shice_v04_state',JSON.stringify(state))}catch(e){}await refreshServerMeta();renderAll();showToast('服务端已读取 '+file.name+' · '+r.rows+' 行');return}
 const text=await file.text();let raw;if(file.name.toLowerCase().endsWith('.json')){raw=JSON.parse(text);if(uploadTarget==='business'||uploadTarget==='validation'){if(!Array.isArray(raw))raw=[raw]}else if(!Array.isArray(raw))throw new Error('该类型JSON应为数组')}else raw=parseCSV(text);if(uploadTarget==='business')state.business=normalizeBusiness(raw);if(uploadTarget==='validation')state.validationBusiness=normalizeBusiness(raw);if(uploadTarget==='products')state.products=normalizeProducts(raw);if(uploadTarget==='platform')state.platform=normalizePlatform(raw);if(uploadTarget==='workforce')state.workforce=normalizeWorkforce(raw);state.lastUpdated[uploadTarget]=Date.now();saveState();showToast('本地已读取 '+file.name+'，诊断已更新')
 }catch(err){openModal(`<h3>文件无法读取</h3><p>${esc(err.message)}</p><p>请使用CSV或JSON。你可以在数据中心下载对应模板。</p><div class="modal-actions"><button class="btn" onclick="closeModal()">知道了</button></div>`)}finally{e.target.value=''}})
function downloadFile(name,text,type='text/plain'){const blob=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}

function exportReport(){const b=state.business,d=getDerived(),p=getPlatformStats(),w=getWorkforceStats(),ps=getProductStats();if(!b){showToast('暂无经营数据');return}let text=`食策AI经营报告｜${state.settings.storeName}｜${state.settings.period}\n\n一、经营结果\n销售收入：${fmtMoney(b.revenue)}\n销量：${b.cups}\n现金利润：${fmtMoney(b.cashProfit)}\n现金利润率：${fmtPct(d.profitRate)}\n\n二、当前判断\n${businessSummaryText()}\n`;if(p)text+=`\n三、平台费用\n合计：${fmtMoney(p.total)}\n${p.rows.map(x=>`${x.category}：${fmtMoney(x.amount)}（${fmtPct(x.share,1)}）`).join('\n')}\n`;if(w)text+=`\n四、人效\n低人效时段：${w.low.map(x=>`${x.hour} ${x.eff.toFixed(2)}单/人时`).join('；')}\n`;if(ps)text+=`\n五、商品结构\n加权毛利率：${fmtPct(ps.weightedMargin,1)}\n重点复核SKU：${ps.rows.filter(x=>x.quad==='optimize'||x.quad==='review').map(x=>x.name).join('、')||'暂无'}\n`;text+=`\n说明：本报告为V0.5.0-R1工程化原型基于已导入数据和规则生成，不替代财务审计或专业经营决策。`;downloadFile('食策AI_'+state.settings.period+'_经营报告.txt',text,'text/plain;charset=utf-8')}
